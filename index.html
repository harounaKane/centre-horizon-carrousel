<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/slider.css">
    <title>Carrousel</title>
</head>

<body>
    <header class="bg-secondary p-4 text-center">
        <h1>Explorez notre galerie d'inspiration</h1>
    </header>

    <main class="container-fluid my-4">
        <button id="toolbar-toggle" class="btn btn-outline-success">
            Afficher/masquer
        </button>

        <div class="toolbar text-center my-3">
            <button id="slider-previous"><i class="fa-solid fa-backward"></i></button>
            <button id="slider-toggle"><i class="fa-solid fa-play"></i></button>
            <button id="slider-next"><i class="fa-solid fa-forward"></i></button>
            <button id="slider-random"><i class="fa-solid fa-random"></i></button>
        </div>

        <figure id="slider" class="text-center mb-5">
            <img src="images/1.jpg" alt="" class="img-fluid">
            <figcaption>Le titre de l'image</figcaption>
        </figure>

    </main>
</body>

</html>
